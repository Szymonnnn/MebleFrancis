        button {

        .kontakt-stopka {

            text-decoration: none;
            margin: 0 0.5em;
        }

            text-decoration: underline;
        }

        /* --- Style dla gry memory --- */
        #gra {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            perspective: 1000px;
        }

        .card {
            width: 120px;
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            border: 2px solid white; /* NOWA biała ramka */
            border-radius: 10px;      /* Zaokrąglenie dla ramki */
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .card-face--front {
            background-color: #3498db;
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .card-face--back {
            transform: rotateY(180deg);
        }
        
        #reset-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #e74c3c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #reset-button:hover {

        }

        .parallax-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 150%; /* większa wysokość niż okno */
        background: url('Trippi troppi.jpg') no-repeat center center;
        background-size: cover;
        transform: translateY(0);
        z-index: -1;
        filter: blur(10px); /* lekki defocus */
        scale: 1.1; /* delikatne powiększenie */
        }

    </style>

    <script>
        // Skrypt JS do gry memory
        document.addEventListener('DOMContentLoaded', () => {
            const gameBoard = document.getElementById('game-board');
            const resetButton = document.getElementById('reset-button');
            const imageCount = 8; 
            let cardImages = [];

            for (let i = 1; i <= imageCount; i++) {
                cardImages.push(`obraz${i}.jpg`);
                cardImages.push(`obraz${i}.jpg`);
            }
            
            let flippedCards = [];
            let lockBoard = false;
            let matchedPairs = 0;
            let moves = 0; // ZMIANA: Zmienna do liczenia ruchów

            function shuffle(array) {
                array.sort(() => Math.random() - 0.2);
            }

            function createBoard() {
                gameBoard.innerHTML = '';
                shuffle(cardImages);
                flippedCards = [];
                lockBoard = false;
                matchedPairs = 0;
                moves = 0; // ZMIANA: Resetowanie licznika ruchów

                cardImages.forEach(imageSrc => {
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.dataset.image = imageSrc;

                    card.innerHTML = `
                        <div class="card-face card-face--front">
                            <img src="rewers.jpg" alt="Rewers">
                        </div>
                        <div class="card-face card-face--back">
                            <img src="${imageSrc}" alt="Obrazek karty">
                        </div>
                    `;

                    card.addEventListener('click', flipCard);
                    gameBoard.appendChild(card);
                });
            }

            function flipCard() {
                if (lockBoard) return;
                if (this === flippedCards[0]) return;

                this.classList.add('is-flipped');
                
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    checkForMatch();
                }
            }

            function checkForMatch() {
                lockBoard = true;
                moves++; // ZMIANA: Zwiększenie licznika ruchów
                const [cardOne, cardTwo] = flippedCards;
                const isMatch = cardOne.dataset.image === cardTwo.dataset.image;

                isMatch ? disableCards() : unflipCards();
            }

            function disableCards() {
                const [cardOne, cardTwo] = flippedCards;
                cardOne.removeEventListener('click', flipCard);
                cardTwo.removeEventListener('click', flipCard);
                
                matchedPairs++;
                resetBoardState();
                
                if (matchedPairs === imageCount) {
                    setTimeout(() => {
                        // ZMIANA: Alert z liczbą ruchów
                        alert('Gratulacje! Wygrałeś/aś w ' + moves + ' ruchach!');
                    }, 500);
                }
            }

            function unflipCards() {
                setTimeout(() => {
                    flippedCards.forEach(card => card.classList.remove('is-flipped'));
                    resetBoardState();
                }, 800);
            }

            function resetBoardState() {
                flippedCards = [];
                lockBoard = false;
            }
            
            resetButton.addEventListener('click', createBoard);
            
            if (gameBoard) {
                createBoard();
            }
        });
    </script>
    <script>
